<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>알림 타이머</title>
<style>
:root {
  --bg: #0f1412; --panel: #151b19; --raised: #1c2421; --line: #27312d;
  --fg: #e4ebe7; --muted: #8a9893; --accent: #3dbb91; --accent-ink: #062218;
  --accent-soft: rgba(61,187,145,.14); --warn: #e0b04f; --done: #7aa7ff; --danger: #f06a6a; --track: #3a4642;
  --num: ui-monospace, "Roboto Mono", "DejaVu Sans Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 15px/1.45 "Noto Sans KR", "Roboto", system-ui, sans-serif; padding: 14px 14px 90px; user-select: none; }
button, input, select { font: inherit; color: inherit; }
h1 { font-size: 19px; margin: 4px 2px 12px; display: flex; align-items: center; gap: 8px; }
h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

.notice { background: rgba(224,176,79,.1); border: 1px solid rgba(224,176,79,.35); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
.notice p { margin: 0; flex: 1; color: #f1d9a6; }
.notice button { flex: none; background: var(--warn); color: #241a05; border: 0; border-radius: 8px; padding: 7px 10px; font-weight: 600; font-size: 13px; }

.bar { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.bar .rd { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 14px; }
.bar .rd .max { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; }
.bar .all { display: flex; gap: 6px; }

.num { width: 58px; height: 36px; text-align: center; background: var(--raised); border: 1px solid var(--line); border-radius: 9px; font-family: var(--num); font-size: 15px; }
.num.s { width: 50px; height: 32px; font-size: 14px; }
.ibtn { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--raised); display: grid; place-items: center; padding: 0; }
.ibtn svg { width: 20px; height: 20px; }
.ibtn:active { transform: scale(.95); }
.ibtn.danger { color: var(--danger); }

.switch { position: relative; display: inline-block; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--track); transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
.card.off { opacity: .55; }
.card.flash { animation: flash 1.1s ease-out; }
@keyframes flash { 0%, 40% { background: rgba(61,187,145,.38); } 100% { background: var(--panel); } }
.head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 0; }
.head .name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--raised); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill[data-s=running] { color: var(--accent); } .pill[data-s=running] i { background: var(--accent); }
.pill[data-s=delay] { color: var(--warn); } .pill[data-s=delay] i { background: var(--warn); }
.pill[data-s=paused] { color: var(--warn); } .pill[data-s=paused] i { background: var(--warn); }
.pill[data-s=done] { color: var(--done); } .pill[data-s=done] i { background: var(--done); }
.body { display: flex; align-items: center; gap: 10px; padding: 6px 12px 12px; }
.clockbox { flex: 1; min-width: 0; }
.clockbox small { display: block; color: var(--muted); font-size: 12px; }
.clockbox small.delay { color: var(--warn); }
.clock { font-family: var(--num); font-size: 40px; font-weight: 700; letter-spacing: 1px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.play { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.play svg { width: 26px; height: 26px; }
.play:disabled { background: var(--track); color: var(--muted); }
.play:active { transform: scale(.95); }

.settings { border-top: 1px solid var(--line); padding: 12px; display: none; gap: 14px; flex-direction: column; background: rgba(0,0,0,.12); }
.card.open .settings { display: flex; }
.card.open .chev svg { transform: rotate(180deg); }
.lbl { font-size: 12px; color: var(--muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.text, select { height: 40px; width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 18px, calc(100% - 12px) 18px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.row select { flex: 1; min-width: 0; }
.unit { color: var(--muted); font-size: 13px; }
input[type=range] { width: 100%; height: 28px; appearance: none; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 9px; background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); }
input[type=range]::-webkit-slider-thumb { appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: #fff; border: 0; }
.seg { display: flex; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg label { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; font-size: 14px; color: var(--muted); }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; }
.toggle div { flex: 1; }
.toggle b { font-weight: 600; font-size: 14px; display: block; }
.toggle span.d { font-size: 12px; color: var(--muted); }
.del { align-self: flex-start; background: none; border: 1px solid rgba(240,106,106,.4); color: var(--danger); border-radius: 10px; padding: 8px 12px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.del svg { width: 16px; height: 16px; }

.add { position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
.add svg { width: 20px; height: 20px; }
.ver { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
.ver button { background: none; border: 0; color: var(--accent); font-size: 12px; padding: 4px 6px; text-decoration: underline; }
.notice.up { background: var(--accent-soft); border-color: rgba(61,187,145,.45); }
.notice.up p { color: var(--fg); }
.notice.up button { background: var(--accent); color: var(--accent-ink); }
.notice.up button:disabled { opacity: .6; }
.pipbtn { margin-left: auto; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--accent); }
#pipView { display: none; }
body.pip { padding: 0; overflow: hidden; }
body.pip > *:not(#pipView) { display: none !important; }
body.pip #pipView { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; gap: 2px; }
body.pip #pipView.flash { animation: flash 1.1s ease-out; }
.pv-top { display: flex; gap: 6px; align-items: baseline; font-size: 13px; max-width: 94vw; }
#pvName { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pvLab { color: var(--muted); font-size: 11px; white-space: nowrap; }
#pvLab.on { color: var(--accent); } #pvLab.delay { color: var(--warn); }
#pvClock { font-family: var(--num); font-weight: 700; font-size: min(30vw, 62vh); line-height: 1; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<h1><span class="dot"></span>알림 타이머<button class="pipbtn" type="button" id="pipBtn" hidden>PIP 모드</button></h1>
<div id="pipView"><div class="pv-top"><span id="pvName"></span><span id="pvLab"></span></div><div id="pvClock">00:00</div></div>
<div id="notices"></div>
<div class="bar">
  <div class="rd">
    <label style="display:flex;align-items:center;gap:8px"><span class="switch"><input type="checkbox" id="rd"><span></span></span>
    <span>랜덤 지연</span></label>
    <span class="max" id="rdmBox">최대 <input class="num s" type="number" inputmode="numeric" min="1" max="600" id="rdm"> 초</span>
  </div>
  <div class="all">
    <button class="ibtn" type="button" data-all="startAll" aria-label="전체 시작"></button>
    <button class="ibtn" type="button" data-all="pauseAll" aria-label="전체 일시정지"></button>
    <button class="ibtn" type="button" data-all="resetAll" aria-label="전체 초기화"></button>
  </div>
</div>
<div id="list"></div>
<div class="ver" id="ver"></div>
<button class="add" type="button" id="add"></button>

<script>
(() => {
  const ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>',
    reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    note: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>'
  };
  const SOUNDS = [
    ['dingdong', '[기타] 띵동띵동'],
    ['f1', '[음성] 사냥 멈춘거 같아요 - 여성1'],
    ['f2', '[음성] 사냥 멈춘거 같아요 - 여성2'],
    ['f3', '[음성] 사냥 멈춘거 같아요 - 여성3']
  ];
  const PRESETS = [['custom', '직접 입력'], ['30', '30초'], ['60', '1분'], ['180', '3분'], ['300', '5분'],
    ['600', '10분'], ['900', '15분'], ['1800', '30분'], ['3600', '1시간']];
  const STATUS = { idle: '대기', delay: '지연 중', running: '진행 중', paused: '일시정지', done: '완료', off: '꺼짐' };

  /* Native bridge; a small JS stand-in keeps the page usable in a desktop browser. */
  const N = window.Native || (() => {
    let cfg = { timers: [] }; const rt = {};
    const now = () => performance.now();
    const R = t => rt[t.id] || (rt[t.id] = { status: 'idle', endAt: 0, remaining: 0, inDelay: false, fired: 0, holdUntil: 0 });
    const durOf = t => ((+t.min || 0) * 60 + (+t.sec || 0)) * 1000;
    const act = r => r.status === 'running' || r.status === 'delay';
    const find = id => cfg.timers.find(t => t.id === id);
    const st = t => { const r = R(t); if (!t.enabled) return; if (r.status === 'paused') { r.status = r.inDelay ? 'delay' : 'running'; r.endAt = now() + r.remaining; return; } if (act(r) || durOf(t) <= 0) return; r.inDelay = false; r.status = 'running'; r.endAt = now() + durOf(t); };
    const pa = t => { const r = R(t); if (act(r)) { r.remaining = Math.max(0, r.endAt - now()); r.status = 'paused'; } };
    const re = t => { const r = R(t); r.status = 'idle'; r.inDelay = false; r.holdUntil = 0; };
    setInterval(() => cfg.timers.forEach(t => { const r = R(t), n = now(); if (!act(r) || n < r.endAt) return;
      if (r.status === 'running' && cfg.randomDelay && cfg.randomMax > 0) { r.delayTotal = 1 + Math.floor(Math.random() * cfg.randomMax); r.holdUntil = n + 450; r.holdDelay = false; r.status = 'delay'; r.inDelay = true; r.endAt = n + 450 + r.delayTotal * 1000; return; }
      r.fired++; r.holdUntil = n + 450; r.holdDelay = r.inDelay; r.holdTotal = r.delayTotal; r.inDelay = false;
      if (t.autoRestart && durOf(t) > 0) { r.status = 'running'; r.endAt = n + durOf(t); } else r.status = 'done';
    }), 100);
    return {
      configure: j => { cfg = JSON.parse(j); cfg.timers.forEach(t => { if (!t.enabled) R(t).status = 'idle'; }); },
      cmd: (a, id) => { const t = find(id);
        if (a === 'start') t && st(t); else if (a === 'pause') t && pa(t); else if (a === 'reset') t && re(t);
        else if (a === 'toggle') t && (act(R(t)) ? pa(t) : st(t));
        else if (a === 'startAll') cfg.timers.forEach(st); else if (a === 'pauseAll') cfg.timers.forEach(pa); else if (a === 'resetAll') cfg.timers.forEach(re); },
      snapshot: () => { const n = now(), timers = {};
        cfg.timers.forEach(t => { const r = R(t), held = n < r.holdUntil;
          const remain = held ? 0 : act(r) ? Math.max(0, r.endAt - n) : r.status === 'paused' ? r.remaining : r.status === 'done' ? 0 : durOf(t);
          timers[t.id] = { status: t.enabled ? r.status : 'off', remain, delay: held ? r.holdDelay : r.inDelay, delayTotal: held ? r.holdTotal : r.delayTotal, held, fired: r.fired }; });
        return JSON.stringify({ timers }); },
      preview: () => {}, batteryRestricted: () => false, openBatterySettings: () => {}, notificationsAllowed: () => true, openNotificationSettings: () => {}
    };
  })();

  /* ---------- saved settings ---------- */
  const KEY = 'alrimi-app-v1';
  let uid = Date.now();
  const newTimer = () => ({ id: String(uid++), enabled: true, mode: 'custom', min: 0, sec: 30, name: '',
    sound: 'dingdong', volume: 80, alertMode: 'once', alertCount: 3, autoRestart: false, vibrate: true, open: false });
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.timers)) S = { randomDelay: false, randomMax: 3, timers: [Object.assign(newTimer(), { open: true })] };
  S.timers.forEach(t => { if (!SOUNDS.some(s => s[0] === t.sound)) t.sound = 'dingdong'; if (t.vibrate === undefined) t.vibrate = true; });
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    N.configure(JSON.stringify(S));
  };

  const fmt = ms => {
    const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    const p = n => String(n).padStart(2, '0');
    return h ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const label = (t, i) => t.name.trim() || `타이머 ${i + 1}`;

  /* ---------- render ---------- */
  const list = document.getElementById('list');
  function cardHTML(t, i) {
    const id = t.id;
    return `<div class="card ${t.open ? 'open' : ''} ${t.enabled ? '' : 'off'}" data-id="${id}">
      <div class="head">
        <span class="name">${esc(label(t, i))}</span>
        <span class="pill"><i></i><span></span></span>
        <span class="switch"><input type="checkbox" data-k="enabled" ${t.enabled ? 'checked' : ''} aria-label="타이머 켜기"><span></span></span>
      </div>
      <div class="body">
        <div class="clockbox"><small>알림까지</small><div class="clock">00:00</div></div>
        <button class="ibtn" type="button" data-a="reset" aria-label="초기화">${ICON.reset}</button>
        <button class="ibtn chev" type="button" data-a="open" aria-label="설정">${ICON.chev}</button>
        <button class="play" type="button" data-a="toggle" aria-label="시작"></button>
      </div>
      <div class="settings">
        <div><div class="lbl">시간</div>
          <div class="row">
            <select data-k="mode" style="flex:1.2">${PRESETS.map(([v, l]) => `<option value="${v}" ${t.mode === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
            <input class="num" type="number" inputmode="numeric" min="0" max="999" data-k="min" value="${t.min}"><span class="unit">분</span>
            <input class="num" type="number" inputmode="numeric" min="0" max="59" data-k="sec" value="${t.sec}"><span class="unit">초</span>
          </div></div>
        <div><div class="lbl">이름</div><input class="text" data-k="name" placeholder="예: 경험치 쿠폰" value="${esc(t.name)}" maxlength="40"></div>
        <div><div class="lbl">알림음</div>
          <div class="row"><select data-k="sound">${SOUNDS.map(([k, l]) => `<option value="${k}" ${t.sound === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <button class="ibtn" type="button" data-a="preview" aria-label="미리 듣기">${ICON.note}</button></div></div>
        <div><div class="lbl"><span>볼륨</span><b class="vol">${t.volume}%</b></div>
          <input type="range" min="0" max="100" data-k="volume" value="${t.volume}" style="--p:${t.volume}%"></div>
        <div><div class="lbl">완료 알림</div>
          <div class="row">
            <div class="seg" style="flex:1">
              <label><input type="radio" name="am-${id}" data-k="alertMode" value="once" ${t.alertMode === 'once' ? 'checked' : ''}>한 번</label>
              <label><input type="radio" name="am-${id}" data-k="alertMode" value="multi" ${t.alertMode === 'multi' ? 'checked' : ''}>여러 번</label>
            </div>
            <span class="cnt" ${t.alertMode === 'multi' ? '' : 'hidden'}><span class="unit">총</span> <input class="num s" type="number" inputmode="numeric" min="2" max="20" data-k="alertCount" value="${t.alertCount}"> <span class="unit">회</span></span>
          </div></div>
        <div class="toggle"><div><b>자동 재시작</b><span class="d">알림이 울리면 같은 시간으로 바로 다시 시작합니다.</span></div>
          <span class="switch"><input type="checkbox" data-k="autoRestart" ${t.autoRestart ? 'checked' : ''} aria-label="자동 재시작"><span></span></span></div>
        <div class="toggle"><div><b>진동</b><span class="d">알림이 울릴 때 휴대폰을 진동합니다.</span></div>
          <span class="switch"><input type="checkbox" data-k="vibrate" ${t.vibrate ? 'checked' : ''} aria-label="진동"><span></span></span></div>
        <button class="del" type="button" data-a="del">${ICON.trash} 타이머 삭제</button>
      </div>
    </div>`;
  }
  const seen = {};
  function render() {
    list.innerHTML = S.timers.length ? S.timers.map(cardHTML).join('') : '<div class="empty">아래 버튼으로 타이머를 추가하세요.</div>';
    tick();
  }
  function tick() {
    let snap; try { snap = JSON.parse(N.snapshot()).timers || {}; } catch (e) { snap = {}; }
    S.timers.forEach(t => {
      const el = list.querySelector(`.card[data-id="${t.id}"]`), r = snap[t.id]; if (!el || !r) return;
      const clock = el.querySelector('.clock'), txt = fmt(r.remain);
      if (clock.textContent !== txt) clock.textContent = txt;
      const sm = el.querySelector('.clockbox small'), lab = r.delay ? `랜덤 지연 ${r.delayTotal}초` : '알림까지';
      if (sm.textContent !== lab) { sm.textContent = lab; sm.classList.toggle('delay', !!r.delay); }
      const pill = el.querySelector('.pill');
      if (pill.dataset.s !== r.status) { pill.dataset.s = r.status; pill.lastChild.textContent = STATUS[r.status] || ''; }
      const active = r.status === 'running' || r.status === 'delay';
      const btn = el.querySelector('.play'), want = active ? 'pause' : 'play';
      if (btn.dataset.i !== want) { btn.dataset.i = want; btn.innerHTML = ICON[want]; btn.setAttribute('aria-label', active ? '일시정지' : '시작'); }
      btn.disabled = !t.enabled;
      if (seen[t.id] !== undefined && r.fired > seen[t.id]) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
      seen[t.id] = r.fired;
    });
    if (document.body.classList.contains('pip')) drawPip(snap);
  }
  // PIP shows one timer: the soonest running one, else a paused one, else the first enabled one
  let pipFired = {};
  function drawPip(snap) {
    const list2 = S.timers.map((t, i) => ({ t, i, r: snap[t.id] })).filter(x => x.r);
    const act = list2.filter(x => x.r.status === 'running' || x.r.status === 'delay').sort((a, b) => a.r.remain - b.r.remain);
    const x = act[0] || list2.find(x => x.r.status === 'paused') || list2.find(x => x.r.status !== 'off') || list2[0];
    const pv = document.getElementById('pipView');
    if (!x) { document.getElementById('pvName').textContent = '타이머 없음'; return; }
    document.getElementById('pvName').textContent = label(x.t, x.i);
    const lab = document.getElementById('pvLab');
    lab.textContent = x.r.delay ? `랜덤 지연 ${x.r.delayTotal}초` : (STATUS[x.r.status] || '');
    lab.className = x.r.delay ? 'delay' : x.r.status === 'running' ? 'on' : '';
    document.getElementById('pvClock').textContent = fmt(x.r.remain);
    if (pipFired[x.t.id] !== undefined && x.r.fired > pipFired[x.t.id]) { pv.classList.remove('flash'); void pv.offsetWidth; pv.classList.add('flash'); }
    list2.forEach(y => pipFired[y.t.id] = y.r.fired);
  }
  setInterval(tick, 200);
  window.onNativeResume = () => { notices(); tick(); };

  /* ---------- top bar ---------- */
  const rd = document.getElementById('rd'), rdm = document.getElementById('rdm'), rdmBox = document.getElementById('rdmBox');
  const syncBar = () => { rd.checked = !!S.randomDelay; rdm.value = S.randomMax; rdmBox.style.visibility = S.randomDelay ? 'visible' : 'hidden'; };
  rd.addEventListener('change', () => { S.randomDelay = rd.checked; syncBar(); save(); });
  rdm.addEventListener('input', () => { S.randomMax = Math.max(0, Math.min(600, Math.floor(+rdm.value || 0))); save(); });
  rdm.addEventListener('blur', () => { if (!(S.randomMax > 0)) S.randomMax = 1; syncBar(); save(); });
  document.querySelectorAll('[data-all]').forEach(b => {
    b.innerHTML = ICON[{ startAll: 'play', pauseAll: 'pause', resetAll: 'reset' }[b.dataset.all]];
    b.addEventListener('click', () => { N.cmd(b.dataset.all, ''); tick(); });
  });
  const add = document.getElementById('add');
  add.innerHTML = `${ICON.plus} 타이머 추가`;
  add.addEventListener('click', () => {
    S.timers.forEach(t => t.open = false);
    S.timers.push(Object.assign(newTimer(), { open: true })); save(); render();
    requestAnimationFrame(() => list.lastElementChild && list.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' }));
  });

  /* ---------- card events ---------- */
  const tOf = el => { const c = el.closest('.card'); return c && S.timers.find(t => t.id === c.dataset.id); };
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const t = tOf(b); if (!t) return;
    const a = b.dataset.a;
    if (a === 'toggle' || a === 'reset') { N.cmd(a, t.id); tick(); }
    else if (a === 'open') { t.open = !t.open; b.closest('.card').classList.toggle('open', t.open); save(); }
    else if (a === 'preview') N.preview(t.sound, t.volume);
    else if (a === 'del') {
      if (!confirmDel(b)) return;
      N.cmd('reset', t.id); S.timers = S.timers.filter(x => x !== t); save(); render();
    }
  });
  // two taps to delete: first tap arms the button for 3 s
  function confirmDel(b) {
    if (b.dataset.armed) return true;
    b.dataset.armed = '1'; const old = b.innerHTML; b.innerHTML = `${ICON.trash} 한 번 더 누르면 삭제`;
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.innerHTML = old; } }, 3000);
    return false;
  }
  function onField(e, final) {
    const el = e.target, k = el.dataset.k; if (!k) return;
    const t = tOf(el); if (!t) return;
    const card = el.closest('.card');
    if (k === 'enabled') { t.enabled = el.checked; card.classList.toggle('off', !t.enabled); if (!t.enabled) N.cmd('reset', t.id); }
    else if (k === 'autoRestart') t.autoRestart = el.checked;
    else if (k === 'vibrate') t.vibrate = el.checked;
    else if (k === 'alertMode') { t.alertMode = el.value; card.querySelector('.cnt').hidden = el.value !== 'multi'; }
    else if (k === 'sound') t.sound = el.value;
    else if (k === 'volume') { t.volume = +el.value; el.style.setProperty('--p', t.volume + '%'); card.querySelector('.vol').textContent = t.volume + '%'; }
    else if (k === 'name') { t.name = el.value; card.querySelector('.name').textContent = label(t, S.timers.indexOf(t)); }
    else if (k === 'alertCount') { t.alertCount = Math.max(2, Math.min(20, Math.floor(+el.value || 2))); if (final) el.value = t.alertCount; }
    else if (k === 'mode') {
      t.mode = el.value;
      if (t.mode !== 'custom') { const s = +t.mode; t.min = Math.floor(s / 60); t.sec = s % 60;
        card.querySelector('[data-k=min]').value = t.min; card.querySelector('[data-k=sec]').value = t.sec; }
    }
    else if (k === 'min' || k === 'sec') {
      const max = k === 'min' ? 999 : 59;
      t[k] = Math.max(0, Math.min(max, Math.floor(+el.value || 0)));
      if (final) el.value = t[k];
      if (t.mode !== 'custom') { t.mode = 'custom'; card.querySelector('[data-k=mode]').value = 'custom'; }
    }
    save();
    if (k === 'min' || k === 'sec' || k === 'mode' || k === 'enabled') tick();
  }
  list.addEventListener('input', e => onField(e, false));
  list.addEventListener('change', e => onField(e, true));

  /* ---------- warnings ---------- */
  function notices() {
    const box = document.getElementById('notices'); let h = '';
    try {
      if (!N.notificationsAllowed()) h += `<div class="notice"><p>알림 권한이 꺼져 있어 상단 알림바에 남은 시간이 보이지 않아요.</p><button type="button" data-n="noti">켜기</button></div>`;
      if (N.batteryRestricted()) h += `<div class="notice"><p>배터리 최적화가 켜져 있으면 화면이 꺼졌을 때 알림이 늦거나 멈출 수 있어요.</p><button type="button" data-n="bat">해제하기</button></div>`;
    } catch (e) {}
    box.innerHTML = h;
  }
  document.getElementById('notices').addEventListener('click', e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    if (b.dataset.n === 'bat') N.openBatterySettings(); else N.openNotificationSettings();
  });

  /* ---------- app update ---------- */
  const upBox = document.createElement('div');
  document.getElementById('notices').before(upBox);
  const ver = document.getElementById('ver');
  let upInfo = null, verMsg = '';
  const drawVer = () => {
    if (!N.version) return;
    ver.innerHTML = `버전 v${esc(N.version())} · <button type="button" id="chk">업데이트 확인</button>${verMsg ? ' · ' + esc(verMsg) : ''}`;
  };
  ver.addEventListener('click', e => { if (e.target.id === 'chk') { verMsg = '확인 중…'; drawVer(); N.checkUpdate(true); } });
  window.onUpdate = info => {
    if (info.error) { verMsg = '확인 실패 (인터넷 연결 확인)'; drawVer(); return; }
    if (!info.newer) { if (info.manual) { verMsg = '최신 버전이에요'; drawVer(); } return; }
    upInfo = info; verMsg = ''; drawVer();
    upBox.innerHTML = `<div class="notice up"><p>새 버전 v${esc(info.version)}이 나왔어요.</p><button type="button" id="upBtn">업데이트</button></div>`;
  };
  window.onUpdateProgress = v => {
    const b = document.getElementById('upBtn'), p = upBox.querySelector('p'); if (!b) return;
    if (typeof v === 'number') { b.disabled = true; b.textContent = v >= 0 ? v + '%' : '받는 중'; p.textContent = '새 버전을 받는 중이에요…'; }
    else if (v === 'confirm') { b.disabled = false; b.textContent = '다시 시도'; p.textContent = '화면에 뜬 창에서 "업데이트"(설치)를 눌러 주세요.'; }
    else { b.disabled = false; b.textContent = '다시 시도'; p.textContent = v === 'cancel' ? '업데이트를 취소했어요.' : '업데이트를 받지 못했어요. 잠시 뒤 다시 시도해 주세요.'; }
  };
  upBox.addEventListener('click', e => {
    if (e.target.id !== 'upBtn' || !upInfo) return;
    if (!N.installUpdate(upInfo.url)) upBox.querySelector('p').textContent = '"이 출처 허용"을 켠 뒤 돌아와서 업데이트를 다시 눌러 주세요.';
  });
  const autoCheck = () => { if (N.checkUpdate) N.checkUpdate(false); };
  const prevResume = window.onNativeResume;
  window.onNativeResume = () => { prevResume(); autoCheck(); };

  /* ---------- PIP ---------- */
  const pipBtn = document.getElementById('pipBtn');
  if (N.pipSupported && N.pipSupported()) { pipBtn.hidden = false; pipBtn.addEventListener('click', () => N.enterPip()); }
  window.onPip = on => { document.body.classList.toggle('pip', !!on); tick(); };

  syncBar(); save(); render(); notices(); drawVer(); autoCheck();
})();
</script>
</body>
</html>
